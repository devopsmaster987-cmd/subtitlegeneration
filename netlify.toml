[build]
  command = "npm run build"
  publish = "out"

# Permanent redirects for merged routes. The built fallback pages carry a meta
# refresh for hosts without redirect support; force so the files do not win.
[[redirects]]
  from = "/video-to-text"
  to = "/video-to-srt"
  status = 301
  force = true

[[redirects]]
  from = "/caption-generator"
  to = "/video-to-srt"
  status = 301
  force = true

[[redirects]]
  from = "/transcript-generator"
  to = "/video-to-srt"
  status = 301
  force = true

[[redirects]]
  from = "/speech-to-text"
  to = "/audio-to-srt"
  status = 301
  force = true

[[redirects]]
  from = "/offline-subtitle-generator"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/private-subtitle-generator"
  to = "/"
  status = 301
  force = true

[build.environment]
  NODE_VERSION = "24"

# Optional isolated studio route. Keep these headers scoped here only:
# site-wide COOP/COEP breaks AdSense.
[[headers]]
  for = "/studio"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/studio/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/ffmpeg/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
